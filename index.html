<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARG: חידות</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #e0e0e0;
            font-family: 'Courier Prime', monospace;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(138, 43, 226, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .title {
            text-align: center;
            margin-bottom: 60px;
        }

        .title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            background: linear-gradient(135deg, #8a2be2, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .title p {
            color: #888;
            font-size: 0.9em;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .puzzles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .puzzle-card {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.1), rgba(255, 0, 127, 0.05));
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .puzzle-card:hover:not(.locked) {
            border-color: rgba(138, 43, 226, 0.6);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
            transform: translateY(-5px);
        }

        .puzzle-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .puzzle-number {
            font-size: 0.8em;
            color: #8a2be2;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .puzzle-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 12px;
            color: #fff;
        }

        .puzzle-description {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0a0e27;
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 8px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            backdrop-filter: blur(20px);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            color: #8a2be2;
            font-size: 1.5em;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ff007f;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #8a2be2;
            font-size: 1.8em;
        }

        .puzzle-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: #fff;
            font-family: 'Courier Prime', monospace;
            border-radius: 4px;
        }

        .puzzle-input:focus {
            outline: none;
            border-color: rgba(138, 43, 226, 0.8);
        }

        .puzzle-button {
            background: linear-gradient(135deg, #8a2be2, #ff007f);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            transition: all 0.3s;
            margin: 10px 10px 10px 0;
        }

        .puzzle-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }

        .hint-text {
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 200, 0, 0.1);
            border-left: 3px solid #ffc800;
            color: #ffc800;
            font-size: 0.9em;
            border-radius: 4px;
        }

        .success-message {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 200, 100, 0.2);
            border-left: 3px solid #00c864;
            color: #00c864;
            border-radius: 4px;
        }

        .error-message {
            margin-top: 10px;
            color: #ff6b6b;
            font-size: 0.9em;
        }

        .final-answer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #8a2be2, #ff007f);
            padding: 15px 25px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s;
            z-index: 999;
        }

        .final-answer.show {
            opacity: 1;
            pointer-events: auto;
        }

        .morse-display {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 1.1em;
            letter-spacing: 2px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .cipher-text {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 1.2em;
            letter-spacing: 3px;
            text-align: center;
            color: #ff007f;
        }

        .progress-bar {
            margin-top: 20px;
            height: 4px;
            background: rgba(138, 43, 226, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #ff007f);
            width: 0%;
            transition: width 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>ARG: הערפל</h1>
            <p>פתור את החידות ומצא את התשובה הסופית</p>
        </div>

        <div class="puzzles-grid" id="puzzlesGrid"></div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="final-answer" id="finalAnswer">🎹 פסנתר!</div>

    <script>
        const gameState = {
            solved: {
                morse: false,
                cipher: false,
                logic: false,
                image: false,
                frequency: false
            }
        };

        const puzzles = [
            {
                id: 'morse',
                title: 'קוד מורס',
                description: 'פענח את ההודעה בקוד מורס',
                number: '01',
                locked: false
            },
            {
                id: 'cipher',
                title: 'צופן החלפה',
                description: 'פענח את הטקסט המוצפן',
                number: '02',
                locked: true
            },
            {
                id: 'logic',
                title: 'לוגיקה מתפתלת',
                description: 'השלם את הסדרה',
                number: '03',
                locked: true
            },
            {
                id: 'image',
                title: 'פאזל ויזואלי',
                description: 'מצא את המילה בתמונה',
                number: '04',
                locked: true
            },
            {
                id: 'frequency',
                title: 'ניתוח תדר',
                description: 'מצא את המילה הנדירה',
                number: '05',
                locked: true
            }
        ];

        function init() {
            renderPuzzles();
            document.getElementById('closeBtn').addEventListener('click', closeModal);
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
        }

        function renderPuzzles() {
            const grid = document.getElementById('puzzlesGrid');
            grid.innerHTML = '';

            puzzles.forEach(function(puzzle) {
                const card = document.createElement('div');
                card.className = 'puzzle-card' + (puzzle.locked ? ' locked' : '');
                
                card.innerHTML = '<div class="puzzle-number">' + puzzle.number + '</div>' +
                                '<div class="puzzle-title">' + puzzle.title + '</div>' +
                                '<div class="puzzle-description">' +
                                (puzzle.locked ? '<span>🔒</span>' : '') +
                                puzzle.description +
                                '</div>';

                if (!puzzle.locked) {
                    card.addEventListener('click', function() {
                        openPuzzle(puzzle.id);
                    });
                }

                grid.appendChild(card);
            });

            updateProgress();
        }

        function openPuzzle(puzzleId) {
            const puzzle = puzzles.find(function(p) { return p.id === puzzleId; });
            if (puzzle && !puzzle.locked) {
                const modal = document.getElementById('modal');
                const body = document.getElementById('modalBody');
                body.innerHTML = '<h2>' + puzzle.title + '</h2>' + getPuzzleContent(puzzleId);
                modal.classList.add('active');
                
                setTimeout(function() {
                    attachPuzzleListeners(puzzleId);
                }, 100);
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function attachPuzzleListeners(puzzleId) {
            const btn = document.querySelector('.puzzle-button');
            if (!btn) return;
            
            if (puzzleId === 'morse') {
                btn.addEventListener('click', solveMorse);
            } else if (puzzleId === 'cipher') {
                btn.addEventListener('click', solveCipher);
            } else if (puzzleId === 'logic') {
                btn.addEventListener('click', solveLogic);
            } else if (puzzleId === 'image') {
                btn.addEventListener('click', solveImage);
            } else if (puzzleId === 'frequency') {
                btn.addEventListener('click', solveFrequency);
            }
        }

        function getPuzzleContent(puzzleId) {
            if (puzzleId === 'morse') {
                return '<p>קוד המורס הבא מסתיר מילה:</p>' +
                       '<div class="morse-display">.--. / .- / -. / ---</div>' +
                       '<p>מה המילה?</p>' +
                       '<input type="text" class="puzzle-input" id="morseAnswer" placeholder="הקלד תשובה...">' +
                       '<button class="puzzle-button">בדוק</button>' +
                       '<div class="hint-text">💡 כיוון: הסכמה או הסכתה</div>' +
                       '<div id="morseError"></div>';
            }
            if (puzzleId === 'cipher') {
                return '<p>צופן החלפה מסתיר הודעה:</p>' +
                       '<div class="cipher-text">תהבוא רעא גדל דךן</div>' +
                       '<p>מה הטקסט המקורי?</p>' +
                       '<input type="text" class="puzzle-input" id="cipherAnswer" placeholder="הקלד תשובה...">' +
                       '<button class="puzzle-button">בדוק</button>' +
                       '<div class="hint-text">💡 כיוון: משהו ממוזיקה</div>' +
                       '<div id="cipherError"></div>';
            }
            if (puzzleId === 'logic') {
                return '<p>מה המספר הבא בסדרה?</p>' +
                       '<div class="cipher-text" style="color: #00ff00;">2, 3, 5, 7, 11, 13, ?</div>' +
                       '<p>הקלד את המספר:</p>' +
                       '<input type="number" class="puzzle-input" id="logicAnswer" placeholder="מספר...">' +
                       '<button class="puzzle-button">בדוק</button>' +
                       '<div class="hint-text">💡 כיוון: מספרים ראשוניים</div>' +
                       '<div id="logicError"></div>';
            }
            if (puzzleId === 'image') {
                return '<p>מה המילה המוסתרת בדפוס הזה?</p>' +
                       '<svg width="100%" height="200" viewBox="0 0 400 200" style="margin: 15px 0; background: rgba(0,0,0,0.3); border-radius: 4px;">' +
                       '<text x="200" y="100" font-size="60" text-anchor="middle" fill="rgba(138, 43, 226, 0.3)" font-weight="bold">PIANO</text>' +
                       '<circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255, 0, 127, 0.2)" stroke-width="2"/>' +
                       '<circle cx="350" cy="150" r="40" fill="none" stroke="rgba(138, 43, 226, 0.2)" stroke-width="2"/>' +
                       '<line x1="0" y1="100" x2="400" y2="100" stroke="rgba(138, 43, 226, 0.1)" stroke-width="1"/>' +
                       '</svg>' +
                       '<p>מה המילה?</p>' +
                       '<input type="text" class="puzzle-input" id="imageAnswer" placeholder="תעתיק עברי...">' +
                       '<button class="puzzle-button">בדוק</button>' +
                       '<div class="hint-text">💡 כיוון: כלי נגינה</div>' +
                       '<div id="imageError"></div>';
            }
            if (puzzleId === 'frequency') {
                return '<p>איזו מילה מופיעה בתדר שונה מהאחרות?</p>' +
                       '<div class="cipher-text" style="color: #ffc800; font-size: 0.9em;">פסנתר, דלת, חלון, דלת, עץ, דלת, אבן, דלת, פסנתר</div>' +
                       '<p>הקלד את המילה הנדירה:</p>' +
                       '<input type="text" class="puzzle-input" id="frequencyAnswer" placeholder="מילה...">' +
                       '<button class="puzzle-button">בדוק</button>' +
                       '<div class="hint-text">💡 כיוון: מה מופיע פחות?</div>' +
                       '<div id="frequencyError"></div>';
            }
            return '';
        }

        function solveMorse() {
            const answer = document.getElementById('morseAnswer').value.trim();
            if (answer.toLowerCase() === 'פנו' || answer.toLowerCase() === 'פן') {
                markSolved('morse');
                showSuccess('משוגע! 🎉');
                unlockPuzzle('cipher');
            } else {
                document.getElementById('morseError').innerHTML = '<div class="error-message">❌ לא נכון</div>';
            }
        }

        function solveCipher() {
            const answer = document.getElementById('cipherAnswer').value.trim();
            if (answer.toLowerCase() === 'מקלדת' || answer.toLowerCase() === 'פסנתר') {
                markSolved('cipher');
                showSuccess('דוקא! 🎉');
                unlockPuzzle('logic');
            } else {
                document.getElementById('cipherError').innerHTML = '<div class="error-message">❌ לא מדויק</div>';
            }
        }

        function solveLogic() {
            const answer = document.getElementById('logicAnswer').value.trim();
            if (answer === '17') {
                markSolved('logic');
                showSuccess('נכון! 🎉');
                unlockPuzzle('image');
            } else {
                document.getElementById('logicError').innerHTML = '<div class="error-message">❌ לא נכון</div>';
            }
        }

        function solveImage() {
            const answer = document.getElementById('imageAnswer').value.trim();
            if (answer.toLowerCase() === 'פיאנו' || answer.toLowerCase() === 'פסנתר') {
                markSolved('image');
                showSuccess('נכון! 🎉');
                unlockPuzzle('frequency');
            } else {
                document.getElementById('imageError').innerHTML = '<div class="error-message">❌ לא זה</div>';
            }
        }

        function solveFrequency() {
            const answer = document.getElementById('frequencyAnswer').value.trim();
            if (answer.toLowerCase() === 'עץ' || answer.toLowerCase() === 'אבן' || answer.toLowerCase() === 'חלון') {
                markSolved('frequency');
                showSuccess('סיימת! 🎉');
                revealFinalAnswer();
            } else {
                document.getElementById('frequencyError').innerHTML = '<div class="error-message">❌ לא זה</div>';
            }
        }

        function markSolved(puzzleId) {
            gameState.solved[puzzleId] = true;
            updateProgress();
        }

        function unlockPuzzle(puzzleId) {
            const puzzle = puzzles.find(function(p) { return p.id === puzzleId; });
            if (puzzle) {
                puzzle.locked = false;
                renderPuzzles();
            }
        }

        function showSuccess(message) {
            const body = document.getElementById('modalBody');
            const div = document.createElement('div');
            div.className = 'success-message';
            div.textContent = message;
            body.appendChild(div);
            setTimeout(function() {
                div.remove();
            }, 3000);
        }

        function updateProgress() {
            const solved = Object.values(gameState.solved).filter(function(v) { return v; }).length;
            const total = Object.keys(gameState.solved).length;
            const percentage = (solved / total) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        function revealFinalAnswer() {
            const finalAnswer = document.getElementById('finalAnswer');
            finalAnswer.classList.add('show');
            setTimeout(function() {
                closeModal();
            }, 500);
        }

        init();
    </script>
</body>
</html>
