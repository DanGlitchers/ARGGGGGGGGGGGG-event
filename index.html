<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תחרות משחקי רובלוקס</title>
    <style>
        /* ייבוא פונט מודרני מגוגל */
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            border: 2px solid #00ffcc;
            max-width: 800px;
            width: 90%;
            margin: 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
        }

        .subtitle {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 30px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            direction: ltr; /* משאיר את המספרים משמאל לימין */
        }

        .time-box {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            min-width: 90px;
            border: 2px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .time-box span {
            display: block;
            font-size: 3.5em;
            font-weight: 900;
            color: #e94560;
        }

        .time-box label {
            font-size: 1.1em;
            color: #fff;
            font-weight: bold;
        }

        /* מוסתר עד שהטיימר נגמר */
        .theme-container {
            margin: 30px 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: none; 
            animation: fadeIn 1.5s ease-in-out;
            border: 2px dashed #ffb86c;
        }

        .theme-title {
            font-size: 1.5em;
            color: #fff;
        }

        .theme-word {
            font-size: 4em;
            font-weight: 900;
            color: #ffb86c;
            text-shadow: 0 0 25px #ffb86c;
            margin-top: 10px;
        }

        .instructions {
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            border-right: 5px solid #5865F2; /* צבע דיסקורד */
            text-align: right;
        }

        .instructions h2 {
            margin-top: 0;
            color: #fff;
        }

        .instructions ol {
            font-size: 1.1em;
            line-height: 1.8;
        }

        .discord-tag {
            background: #5865F2;
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            display: inline-block;
            margin: 5px 0;
            user-select: all; /* מאפשר העתקה קלה */
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>תחרות הבנייה הגדולה</h1>
        <p class="subtitle">הנושא ייחשף ברגע שהטיימר יגיע לאפס. התכוננו!</p>

        <div class="timer" id="timer-container">
            <div class="time-box">
                <span id="hours">00</span>
                <label>שעות</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>דקות</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>שניות</label>
            </div>
        </div>

        <div class="theme-container" id="theme-reveal">
            <div class="theme-title">הנושא הרשמי של התחרות הוא:</div>
            <div class="theme-word" id="theme-word"></div>
        </div>

        <div class="instructions">
            <h2>איך נרשמים לתחרות?</h2>
            <ol>
                <li>שלחו הודעה פרטית בדיסקורד למשתמש: <span class="discord-tag">datykvuktf</span></li>
                <li>המתינו לאישור ידני.</li>
                <li>לאחר האישור, תקבלו גישה ותוכנסו לעולם התחרות הרשמי!</li>
            </ol>
        </div>
    </div>

    <script>
        // תאריך היעד: 8 באפריל 2026, שעה 16:00 בדיוק
        const countDownDate = new Date("2026-04-08T16:00:00").getTime();

    
        const hiddenTheme = [1489, 1512, 1490, 1490, 1504, 1512, 1493, 1496];

        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            // חישוב הזמן שנותר
            // הופך גם ימים לשעות כדי שהטיימר ייראה יותר אינטנסיבי (למשל "42 שעות")
            const hours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // עדכון המסכים עם אפס מוביל (למשל 09 במקום 9)
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // מה קורה כשהטיימר מגיע לאפס?
            if (distance < 0) {
                clearInterval(timerInterval); // עוצר את הטיימר
                document.getElementById("timer-container").style.display = "none"; // מעלים את הטיימר
                
                // מרכיב את המילה "בריינרוט" מהמספרים וחושף אותה
                const revealedTheme = String.fromCharCode(...hiddenTheme);
                document.getElementById("theme-word").innerText = revealedTheme;
                document.getElementById("theme-reveal").style.display = "block"; // מציג את קופסת הנושא
            }
        }, 1000); // מתעדכן כל שנייה
    </script>
</body>
</html>
