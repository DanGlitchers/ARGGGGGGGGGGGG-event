<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Creator AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0d1117] text-gray-200 flex h-screen overflow-hidden">

    <aside class="w-72 bg-[#161b22] border-l border-gray-700 flex flex-col p-4">
        <button id="new-project-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mb-6 transition-all shadow-lg active:scale-95">
            + פרויקט חדש
        </button>
        <div class="flex-1 overflow-y-auto space-y-2" id="project-list">
            </div>
    </aside>

    <main class="flex-1 flex flex-col relative">
        <header class="bg-[#161b22] p-4 border-b border-gray-700">
            <h1 id="current-project-title" class="text-xl font-semibold text-white">בחר פרויקט מהצד כדי להתחיל</h1>
        </header>

        <div id="chat-window" class="chat-container flex-1 overflow-y-auto p-6 space-y-6 flex flex-col">
            <div class="bg-gray-800 p-4 rounded-2xl max-w-[80%] self-start border border-gray-700 text-blue-300">
                ברוך הבא! צור פרויקט חדש בסיידבר כדי שנתחיל לבנות את המשחק שלך.
            </div>
        </div>

        <div class="p-6 bg-gradient-to-t from-[#0d1117] to-transparent">
            <div class="max-w-4xl mx-auto relative flex items-center gap-2">
                <input id="user-input" type="text" 
                       class="w-full bg-[#21262d] border border-gray-600 text-white p-4 rounded-xl focus:outline-none focus:border-blue-500 transition-all shadow-xl"
                       placeholder="כתוב לי מה תרצה לעשות ברובלוקס...">
                <button id="send-btn" class="bg-blue-600 p-4 rounded-xl hover:bg-blue-500 transition-colors shadow-lg active:scale-95">
                    שלח
                </button>
            </div>
        </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
